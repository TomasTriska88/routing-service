name: Java tests and public portfolio guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check repository boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          allowed_files = {
              ".gitignore", "Dockerfile", "README.md", "docker-compose.yml",
              "mvnw", "mvnw.cmd", "pom.xml",
              ".github/workflows/java-ci.yml",
          }
          allowed_prefixes = (".mvn/", "src/main/", "src/test/")
          private_markers = (
              "markvarec", "homeassistant", "home_assistant",
              "prcek", "hnizdo", "lina", "ezviz", "imou", "tailscale",
          )
          blocked = []
          for path in filter(None, tracked):
              lower = path.lower()
              if not (path in allowed_files or path.startswith(allowed_prefixes)):
                  blocked.append(f"unexpected path: {path}")
              if any(marker in lower for marker in private_markers):
                  blocked.append(f"private project path: {path}")
              if lower.endswith((".env", ".pem", ".key", ".p12", ".pfx")):
                  blocked.append(f"secret-like file: {path}")
          if blocked:
              print("\n".join(blocked))
              sys.exit(1)
          print("Tracked files remain within the public portfolio scope.")
          PY

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress test
