capture:
  name: Capture camera event
  description: Store a current camera or image entity frame in the local Markvarec event spool.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain:
            - camera
            - image
    camera:
      required: false
      example: dvur
      selector:
        text:
    source:
      required: false
      example: manual
      selector:
        text:
    synthetic:
      required: false
      default: false
      selector:
        boolean:
mark_processed:
  name: Mark camera event processed
  description: Mark one stored camera event as processed after successful interpretation.
  fields:
    event_id:
      required: true
      selector:
        text:
